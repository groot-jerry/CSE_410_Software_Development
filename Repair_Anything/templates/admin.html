<!DOCTYPE html>
{% load static %}
{% include 'headernavbar.html' %}

<div class="container mt-5">
    <h1>Admin Dashboard</h1>
    <hr>
    
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>All Products</h2>
        <a href="{% url 'adminpanel:product_create' %}" class="btn btn-success">Add New Product</a>
    </div>

    <div class="row">
        {% for p in products %}
        <div class="col-md-4 mb-4">
            <div class="card product-card">
                <div class="card-body">
                    {% if p.image %}
                    <img src="{{ p.image.url }}" class="card-img-top product-image" alt="{{ p.name }}">
                    {% endif %}
                    <h5 class="card-title">{{ p.name }}</h5>
                    <p class="card-text">{{ p.description }}</p>

                    <!-- Admin Control -->
                    <div class="mt-2">
                        <a href="{% url 'adminpanel:product_edit' p.pk %}" class="btn btn-warning btn-sm">Edit</a>
                        <a href="{% url 'adminpanel:product_delete' p.pk %}" class="btn btn-danger btn-sm">Delete</a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% include 'footer.html' %}

<style>
.product-card {
    border: 1px solid #ddd;
    border-radius: 5px;
    box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
    transition: box-shadow 0.3s ease;
    width: 23%;
    margin: 0 1%;
    margin-bottom: 20px;
    float: left;
}

.product-card:nth-child(4n) {
    margin-right: 0;
}

.product-card:hover {
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
}

.product-image {
    width: 100%;
    height: auto;
    border-top-left-radius: 5px;
    border-top-right-radius: 5px;
}

.product-title {
    font-size: 1.25rem;
    font-weight: bold;
    margin-bottom: 0.5rem;
}

.product-description {
    color: #666;
    margin-bottom: 1rem;
}

.product-btn {
    background-color: #007bff;
    color: #fff;
    border: none;
    border-radius: 3px;
    padding: 0.5rem 1rem;
    text-decoration: none;
    transition: background-color 0.3s ease;
    display: block;
}

.product-btn:hover {
    background-color: #0056b3;
}
</style>
