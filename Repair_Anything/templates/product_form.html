<!-- templates/product_form.html -->
 <!DOCTYPE html>
{% include 'headernavbar.html' %}
{% load static %}

<html>
<head>
    <title>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Product</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Product</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">Save</button>
            <a href="{% url 'adminpanel:product_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
{% include 'footer.html' %}
</html>


<style>
.product-card {
    border: 1px solid #ddd;
    border-radius: 5px;
    box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
    transition: box-shadow 0.3s ease;
    width: 23%;
    margin: 0 1%;
    margin-bottom: 20px;
    float: left;
}

.product-card:nth-child(4n) {
    margin-right: 0;
}

.product-card:hover {
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
}

.product-image {
    width: 100%;
    height: auto;
    border-top-left-radius: 5px;
    border-top-right-radius: 5px;
}

.product-details {
    padding: 1rem;
}

.product-title {
    font-size: 1.25rem;
    font-weight: bold;
    margin-bottom: 0.5rem;
}

.product-description {
    color: #666;
    margin-bottom: 1rem;
}

.product-btn {
    background-color: #007bff;
    color: #fff;
    border: none;
    border-radius: 3px;
    padding: 0.5rem 1rem;
    text-decoration: none;
    transition: background-color 0.3s ease;
    display: block;
}

.product-btn:hover {
    background-color: #0056b3;
}
</style>
